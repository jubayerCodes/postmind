services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: postmind-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=5000
      - NODE_ENV=development
      - FRONTEND_URL=http://localhost:3000
    networks:
      - postmind-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-https://rqcaoksdmazghdccaybv.supabase.co}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJxY2Fva3NkbWF6Z2hkY2NheWJ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2MDAyNjIsImV4cCI6MjEwNDE3NjI2Mn0.ys5FCh3bOmc3lycFgaItrrhg7lTuczKK7B9F9wtSsys}
    container_name: postmind-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - postmind-network

networks:
  postmind-network:
    driver: bridge
